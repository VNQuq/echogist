# EchoGist model + pricing config — DATA, not code.
#
# Edit this file to add/update tiers, model IDs, prices, or the model-asset
# source URL WITHOUT touching Python (CLAUDE.md: "Config is data, not code").
#
# Prices are USD per million tokens (MTok). Verify model IDs + prices against
# the Claude API reference when bumping. A deprecated/unknown model does not
# crash the app — the summarize call surfaces it and Settings guides re-select.
#
# FLOATING ALIASES (intentional — freshness over reproducibility). Every tier
# pins an UNDATED alias (claude-haiku-4-5, not claude-haiku-4-5-YYYYMMDD).
# Anthropic migrates an alias to its newest snapshot within ~a week of release,
# so we drift forward to the latest model for free, with no edit here. The
# ACCEPTED tradeoff: model behavior can shift under us between runs, and output
# is NOT reproducible across a silent snapshot migration. That is the desired
# behavior for this tool — always-latest — not a bug. Only a GENERATION bump
# (e.g. Sonnet 4.6 -> 5) is a deliberate human edit to the model_id below.
#
# `context_window` is DERIVED, not hand-maintained: scripts/check-models.py reads
# it from the live model list (GET /v1/models -> max_input_tokens) and updates it
# here. `price_in/out_per_mtok` stay MANUAL — there is no pricing API endpoint, so
# a human verifies them against the pricing page (see `prices_unverified` below).

# Optional per-tier `temperature`: OMITTED here on purpose. The current Claude models
# (Haiku 4.5 / Sonnet 5 / Opus 4.8) deprecate the temperature parameter and
# reject the request (HTTP 400) if it is sent. Add `temperature = 0` to a tier ONLY
# for an older model that still honors sampling and where you want a pinned title
# (the summary filename stem) so a re-run overwrites instead of making a -2/-3 copy.

# `output_per_input_ratio` — projected OUTPUT tokens per INPUT token for this model
# under the v2 synthesis prompt. It is what the cost estimate multiplies each call's
# input by (TD-24), so it is the ONE number to re-seed after a real run.
#
# RECIPE, and it needs no code and no transcript: take a finished run's own
# "Actual cost: $X (A input + B output tokens)" line, compute B / A, add ~5%. That is
# it. For a folder run use the run's TOTAL, which is the strongest sample you can get.
# Biased high on purpose: the estimate must stay above the bill (CLAUDE.md).

[tiers.economy]
model_id = "claude-haiku-4-5"
context_window = 200000
price_in_per_mtok = 1.0
price_out_per_mtok = 5.0
# MEASURED 2026-09-04 on the operator's seven-lecture RU course, 59 calls end to end:
# 311,829 output / 841,122 input = 0.3707, and the per-file spread was 0.365-0.376 —
# tight enough across K=6..12 that the proportional model is clearly the right shape.
# Seeded 5% above it; the resulting quote for that same run is 1.07x the real bill.
output_per_input_ratio = 0.39

[tiers.balanced]
model_id = "claude-sonnet-5"
context_window = 1000000
price_in_per_mtok = 3.0
price_out_per_mtok = 15.0
# RE-SEEDED 2026-09-06 from the third `КУРС2025` run (6 lectures, 18h18m, 46 calls),
# the first clean unstitched whole-course measurement on this tier: 177,367 output over
# 600,963 input = 0.29513 aggregate, per file 0.2828-0.3008 (a 0.018 spread). Run 2's five
# clean files said 0.2805, so two independent aggregates exist and the trend is upward.
# The old 0.24 was an n=1 June guess and made the run-3 gate quote $3.9616 against a
# $4.4634 bill — 0.89x, UNDER (TD-35). The input leg needs no margin (it is read off the
# real transcripts and landed 0.9987x), so this one number carries the whole bias.
# Seeded above the +5% rule (which gives 0.31, only 1.03x) so a SINGLE file at the highest
# ratio ever measured — 0.3171 on run 2 — is still quoted over, not under: 0.33 quotes
# 1.07x the run-3 bill, the same margin economy carries.
output_per_input_ratio = 0.33
# scripts/check-models.py sets this true on a generation bump; a human clears it
# after verifying the prices above against the Anthropic pricing page. While true,
# the summarize flow prints a one-time non-blocking notice (it never blocks the run
# or moves the gate). Verified 2026-08-03: Sonnet 5 is $3 / $15 in/out, same as 4.6.
prices_unverified = false

[tiers.flagship]
model_id = "claude-opus-4-8"
context_window = 1000000
price_in_per_mtok = 5.0
price_out_per_mtok = 25.0
# NOT measured — no full run on this tier yet. Left at the shipped default (the highest
# measured ratio plus margin), so an unknown model is priced as the most verbose one we
# have numbers for. Re-seed from the first real Opus run's own "Actual cost" line.
output_per_input_ratio = 0.40

[guard]
# Fraction of a tier's context window usable by one single-pass transcript+prompt.
# The overflow guard (plan §4) stops cleanly above this. Biased to estimate high.
safe_budget_fraction = 0.8
# The old `output_tokens_estimate` (a flat 4,600 output tokens for EVERY call) was
# REMOVED 2026-09-04 in favour of the per-tier `output_per_input_ratio` above (TD-24).
# It was wrong in both halves: flat made the quote scale with the phase split instead of
# with the material, and 4,600 under-quoted the first real folder run ($2.2394 against a
# $2.4003 bill). Cost output is now projected per call from that call's own input.


[summarize]
# The ONE network stage (plan §3, T6). DATA, not code: edit the prompt TEXT here
# without touching Python (CLAUDE.md "Config is data"). The tool-use SCHEMA (the
# title+sections field contract) stays in echogist/summarize.py so the prompt and
# the parser can't drift. Two substitution tokens are replaced at call time:
#   {language}   -> the target summary language (Russian / English).
#   {unassigned} -> the fixed "unassigned" owner label for that language, so the
#                   model never free-chooses the wording (Не назначено / Unassigned).
# Both are filled by build_request() in echogist/summarize.py.
#
# max_output_tokens is the API's hard max_tokens cap. It is also the ceiling the cost
# projection clamps a call's projected output to, but it is never the projection itself
# (that is the per-tier output_per_input_ratio above): a flush cap would
# truncate a long multi-section RU summary into invalid tool-use JSON and waste the
# paid call, so it carries real headroom for Cyrillic tokenization. No beta header is
# required at this size: Haiku 4.5 / Sonnet 4.6 cap at 64K output and Opus 4.8 at 128K.
#
# RAISED 8192 -> 12288 after the first real folder run (2026-09-04). A 2h52m RU lecture
# on `economy` (Haiku) split at the OLD phase_target_tokens=24000 into K=3, i.e. ~57min
# of speech per call, and phase 1 hit the cap and was cut off — the loud max_tokens guard
# fired and failed the file. The real fix is the smaller phase below; this cap is the
# INSURANCE, and it is free: you are billed per token GENERATED, never for the ceiling.
# The truncation means Haiku's true output/input ratio is only known as a LOWER bound
# (>8192 out on ~22k in, i.e. >=0.39 — Sonnet ran ~0.18 on the same prompt), so the cap
# is sized to absorb a ratio up to ~0.93 at the new phase size. Kept UNDER the ~16000
# line where the summarize call would have to switch to streaming to dodge SDK timeouts;
# going above that is a code change, not a config edit.
max_output_tokens = 12288

# The smallest reply the reconcile call can produce — the ONE fixed per-call cost in the
# cost model, and what stops a folder of fifty short clips quoting the same as one long
# lecture. Derived from the reconcile prompt below, not fitted: title + essence block
# (core_idea 250-350 words, main_skill 150-200, three questions with 2-4 sentence
# answers) + 5-8 themes + one heading per phase is ~700 Russian words even at K=1, and RU
# runs ~3.5 tokens/word at the guard's rate. Rounded DOWN so it stays a floor. Move it if
# you materially change reconcile_system_prompt's word budget.
reconcile_output_floor_tokens = 2500

# Synthesis step (TD-16 v2 direct synthesis): synthesize ONE phase (a contiguous time
# span) of the transcript into faithful, readable prose. The transcript is ground truth,
# read directly — one hop, no lossy intermediate layer. {language} is the target;
# {interpretation} is the per-language label for the inline marker that flags any bridge
# beyond what the author literally said (filled at call time, like {unassigned}). The
# emit_phase tool SCHEMA stays in echogist/summarize.py so prompt and parser cannot drift.
synthesis_system_prompt = """
You are a faithful synthesizer. You are given ONE phase (a contiguous time span) of a \
longer timestamped transcript, and you write a single readable passage of prose in \
{language} that conveys what the author actually says in THIS phase.

Ground every sentence in the transcript text you are given — it is the source of truth. \
Do not invent, do not embellish, do not soften or invert the author's stance, and keep \
their caveats and qualifications. Do not merge two distinct points into one. This is a \
faithful synthesis, not a transcript and not a bullet list.

Cover the ENTIRE span of THIS phase. Every distinct point, example, argument, and \
qualification the author makes here must be represented — do not skip, compress away, or \
sample the material. Your passage must be proportional to the content: a long, dense \
phase requires proportionally more prose than a short one. A phase that spans many \
minutes of substantive talk but reduces to a few sentences has dropped content, and that \
is a failure of this task. When in doubt, include the point rather than omit it.

Anchors: weave [HH:MM:SS] timecodes INLINE into the prose at the points they support — \
put one where a distinct point, example, or shift begins, so the reader can jump to that \
spot in the recording as they read. A handful well-placed across the passage reads far \
better than a wall of timecodes; do not list them all. Also copy the same timecodes into \
the anchors field, and one onto each decision and action item. Copy ONLY timecodes that \
ACTUALLY APPEAR in the transcript text of THIS phase; never invent, round, or interpolate \
one, and if you are unsure give no anchor rather than a wrong one.

Interpretation: you may add a short bridging clause to connect the author's points for \
readability, but anything that goes beyond what the author literally says MUST be marked \
inline with the token [{interpretation}]: immediately before that bridging text, so the \
reader sees author-versus-you at a glance. Use it sparingly.

PRIOR CONTEXT: if the request includes a "PRIOR CONTEXT" section (the tail of the \
previous phase's prose plus the earlier phase headings), use it ONLY for continuity — to \
avoid re-introducing what was already said and to keep one coherent thread. Do NOT \
restate, re-summarize, or quote it; synthesize only THIS phase's transcript. Continuity \
does NOT mean omission: if THIS phase resumes, develops, or returns to a theme the prior \
phase touched, the new detail here is fresh material that you MUST synthesize in full. \
"Do not restate" forbids only literally re-explaining the previous phase's own content — \
never treat it as licence to skip points the author actually makes in THIS phase.

decisions / action_items: include any concrete decisions or next actions stated in THIS \
phase, each with its anchor. Empty lists are correct for material with none — never \
invent one. Write naturally in {language}, not a word-for-word translation. Write every \
word in the writing system of {language} itself: never substitute a word or a syllable \
from another script, even where a shorter one exists. Call the emit_phase tool exactly \
once.
"""

# The "writing system of {language}" sentence in BOTH prompts (added 2026-09-04) is a
# MITIGATION, not the fix. The first real folder run had `economy`/Haiku splice Chinese
# morphemes into the middle of Russian words — `как催化剂для перехода`, `и技ической
# полноты`, `Преподаватель描написывает` — three words across seven lectures. A prompt is a
# wish addressed to a sampler and cannot be trusted on its own, so the real guard is the
# deterministic offline check in echogist/alphabet.py, which also MEASURES whether this
# sentence helped. Do not delete one without the other.

# Reconcile step (TD-16 v2): the document-level header + the ESSENCE BLOCK, derived ONLY
# from the already-written phase passages — it never re-reads the transcript (that would be
# a second lossy hop). It also flags any contradiction the phases left across a seam. The
# emit_reconcile tool SCHEMA lives in echogist/summarize.py.
#
# The essence block (core_idea + main_skill + test_questions) is the 1-2 page digest that
# opens the rendered document: what the material says, what it teaches you to DO, and three
# questions that check whether you actually got it. The word budgets below are what keeps it
# to 1-2 pages — a rendered PDF page is roughly 500 words at the body size, so ~600 words of
# block plus three one-line questions lands just over one page. The ANSWERS are written here
# too but render at the very END of the document, far from their questions, so reading a
# question does not hand you its answer; that is why each answer must stand alone.
reconcile_system_prompt = """
You are given the already-written phase passages (their headings and prose) of ONE \
transcript that was synthesized phase by phase, in order. Produce the document-level \
header and the essence block, written entirely in {language} and entirely in the writing \
system of {language} — never a word or a syllable from another script — by calling the \
emit_reconcile tool exactly once:
- title: a short, specific, human-meaningful title (no date, no extension, no quotes).
- core_idea: ESSENCE POINT 1 — the single central point a reader should leave with, \
about 250-350 words. Not a list of topics: the actual claim the material makes, with the \
reasoning that supports it and the conditions the author puts on it.
- main_skill: ESSENCE POINT 2 — the ONE thing this material teaches the reader to DO, \
about 150-200 words: what the skill is, when to apply it, and how the author says to \
carry it out. Prefer the skill the author spends the most effort teaching over the one \
that merely sounds most impressive. If the material genuinely teaches no skill (a status \
meeting, a news roundup), return an empty string — do NOT invent one.
- test_questions: ESSENCE POINT 3 — EXACTLY 3 questions that check whether the reader \
understood this material, each with its reference answer. A question must be answerable \
ONLY by someone who followed the content — never a yes/no, never something answerable \
from the title alone, and it must not contain or hint at its own answer. Aim one question \
at the core idea, one at the main skill, and one at a distinction or caveat a careless \
reader would miss. Each answer is 2-4 sentences, grounded in the passages; it is printed \
far away from its question, so write it to stand on its own.
- main_themes: the 5-8 threads that run across the phases, each a short noun phrase.
- phase_headings: rewrite the phase headings into ONE coherent outline for the whole \
document, EXACTLY one per phase and in the SAME order as the phases given. They were \
written one at a time, forward-only, so they read as disjoint labels; make them cohere as \
a meta-frame — parallel in form and clearly part of one structure. Keep each heading \
faithful to its OWN phase's content; change only wording and parallelism, never which \
phase it describes. Return as many headings as there are phases.
Base everything ONLY on the phase passages you are given; add no facts that are not in \
them. If two phases state contradictory things about the same point, note the \
contradiction in core_idea rather than silently choosing one.
"""

[chunk]
# TD-16 v2 direct synthesis: target tokens per CONTIGUOUS phase (no overlap). K is
# computed = ceil(total_tokens / this), so it scales with length (NOT a 3-4 cap).
#
# LOWERED 24000 -> 12000 after the first real folder run (2026-09-04). 24000 was fitted
# to the validated 3h lecture landing at ~4 phases on `balanced` (Sonnet). It was never
# exercised on `economy` (Haiku), which is the DEFAULT tier — and Haiku writes far more
# prose per unit of input under the "cover the ENTIRE span, when in doubt include" phase
# contract. At 24000 a 2h52m lecture became K=3 (~57min of speech in one call) and the
# reply blew straight through max_output_tokens. Sizing rule: keep a phase's span short
# enough that faithful prose over it fits the cap with room to spare.
#
# Measured on the real 3h22m57s RU transcript (198 blocks, ~83k body tokens):
#   target   K   max phase in-tok   max span   quoted $/file (economy)
#    24000   4         22005          54 min      0.2204   <- overflowed the cap
#    12000   7         13203          32 min      0.3062
#    10000   9         10335          26 min      0.3634
# The quoted deltas above are an ARTEFACT of the old flat per-call output projection and
# no longer occur: the cost model prices each call from its own input, so the same
# material quotes the same output however it is split (TD-24, closed 2026-09-04). Only the
# per-call prompt overhead still moves with K, which is real. Pick this number for
# OUTPUT-CAP safety (a phase whose prose fits under max_output_tokens), not for price.
phase_target_tokens = 12000

# TD-26 transcript hygiene — applied to the SYNTHESIS INPUT only; the saved transcript on
# disk keeps every block, because it is the operator's ground truth against the recording.
#
# Whisper emits training-set subtitle boilerplate over silence, music, or a title card. On
# the operator's real lecture that is six opening minutes of "Добро пожаловать на наш канал!"
# plus a run of "Субтитры сделал <name>" mid-file — 10 of 198 blocks. The synthesis prompt
# calls the transcript ground truth and forbids dropping material, so without this the model
# faithfully summarizes a YouTube greeting as lecture content. That is fabrication entering
# UPSTREAM of the model, where neither the groundedness contract nor the anchor validator
# looks: the timecodes are real, only the words are invented.
#
# MEASURED over 13 real lectures (2451 blocks), not guessed — and the measurement replaced
# the metric, not just the number (TD-33). The old rule scored a block by its unique-word
# ratio, which cannot tell a stuck decoder from a lecturer repeating a phrase to make a
# point. This operator's lectures do the latter constantly: a Socratic drill whose answer
# is "Сил, опыта, терпения" five times scores 0.550 against the old 0.55 floor, and
# a student's 181-word confession scores 0.547. The ratio destroyed 39 blocks of genuine
# speech (5172 words, ~39 minutes) to catch 18 loops.
#
# A decoder loop repeats ONE PHRASE VERBATIM, so a single 3-gram blankets the block:
# measured 0.60-1.00 for every loop in the corpus ("I love you" x83 = 1.00, "Добро
# пожаловать на наш канал!" = 0.60-0.80, "Субтитры сделал <name>" = 1.00). Rhetorical
# repetition is scattered among varied sentences and never exceeded 0.20. The floor sits in
# that gap, nearer the loops. At 0.50 the corpus gives 18 loops caught and 0 real blocks
# lost.
#
# Calibrated on ONE speaker in ONE language. Raise it if a real block with heavy legitimate
# repetition (a chant, a drill, a counted exercise) still gets cut; lower it if boilerplate
# survives.
max_loop_coverage = 0.50
# Word count under which a block cannot hold a minute of talk. Used ONLY for blocks touching
# a detected loop, so a quiet moment surrounded by real speech is never cut on length alone.
min_block_words = 15

[scan]
# The folder scanner prices summaries BEFORE anything is transcribed, so it turns each
# file's duration into a character count with these two numbers. Both are seeded above
# measured speech on purpose: an under-quote is the only failure mode that spends money
# the operator did not agree to.
#
# RESEEDED 150 x 7 -> 135 x 6.5 on 2026-09-04 (TD-23 closed). The shipped pair was never
# measured. Against the operator's real course the measurement is 122 wpm / 6.21
# chars/word (lecture 4, 198 blocks, direct count), corroborated across all seven
# lectures by the run's own gate: 150 x 7 = 1050 chars/min against a real ~760.
# 135 x 6.5 = 878 chars/min keeps a deliberate ~1.15x margin over measured speech, and
# the whole scan quote for that course now lands ~1.4x the real bill — still high, but a
# KNOWN margin instead of an unmeasured one, and above the bill rather than under it.
words_per_minute = 135
chars_per_word = 6.5

[transcript]
# Timecode granularity of the saved transcript (and the text the summarizer reads).
# Whisper emits a segment per VAD pause (~2-10s); echogist groups them into blocks of
# ~this many seconds so one [HH:MM:SS] marks a readable chunk instead of every breath.
# The block's timecode is its first segment's real start, so section_timecodes stay
# citeable. Lower = finer/more anchors; higher = coarser. Optional (default 60).
block_seconds = 60

[model_asset]
# Whisper model distribution (TD-1). Provisioning fetches the CT2 large-v3 weights
# from Hugging Face (float16 on disk); T3 loads them with compute_type=int8_float16
# (quantized at load — the int8 speed/VRAM win). One-time provisioning fetch, not a
# pipeline stage — the killswitch is unaffected.
name = "large-v3-int8_float16"
# The HF repo the model is pulled from (vanilla large-v3, no fine-tune).
hf_repo = "Systran/faster-whisper-large-v3"
# Pre-placed local model directory escape hatch (app-relative or absolute). If
# local_dir/model.bin already exists, provisioning skips the fetch (offline-safe).
# The model arrives outside requirements.lock; integrity is HF's checksums, an
# accepted tradeoff for a personal tool.
local_dir = "models/large-v3-int8_float16"
